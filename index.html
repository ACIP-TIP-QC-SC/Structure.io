<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Skyscraper.io</title>
  <meta name="description" content="A civil-engineering trivia game. Eight prompts, rare answers build higher. Can you reach 1,000 m?" />
  <meta name="theme-color" content="#0047ab" />
  <meta property="og:title" content="Skyscraper.io" />
  <meta property="og:description" content="Eight prompts. Rare answers build higher. Obvious ones barely leave the ground." />
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css?v=20261127c" />
</head>
<body data-phase="intro">
  <!-- backgrounds -->
  <div id="sky" aria-hidden="true"></div>
  <div id="endBg" aria-hidden="true">
    <div id="plans"></div>
  </div>
  <canvas id="flat" aria-label="Your tower under construction"></canvas>
  <canvas id="scene" aria-label="Your finished tower"></canvas>
  <canvas id="fx" aria-hidden="true"></canvas>

  <!-- top bar -->
  <header id="topbar">
    <a href="#" id="homeLink" class="brand" aria-label="Skyscraper.io home">
      <img src="assets/aci-chapter-logo.png" alt="ACI TIP Quezon City Student Chapter" width="52" height="40" />
      <span class="word">SKYSCRAPER<span>.io</span></span>
    </a>
    <div id="pips" aria-label="Round progress"></div>
    <div id="hud">
      <button id="muteBtn" class="icon-btn" aria-pressed="false" aria-label="Mute sound" title="Sound on/off">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path class="wave" d="M16 8.5a4.5 4.5 0 0 1 0 7M18.5 6a8 8 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path class="cross" d="M16 9l6 6M22 9l-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
      <div class="hud-box"><span class="hud-label mono">HEIGHT</span><span id="hudHeight" class="mono" aria-live="polite">0 m</span><span id="hudTier" class="mono"></span></div>
    </div>
  </header>

  <!-- intro -->
  <section id="intro" class="panel">
    <img class="intro-logo" src="assets/aci-chapter-logo-lg.png" alt="ACI TIP Quezon City Student Chapter" width="640" height="489" />
    <h1 class="intro-title">Skyscraper</h1>
    <p class="intro-sub">Build the tallest tower on the skyline.</p>
    <button id="startBtn" class="btn primary wide">Break ground <span aria-hidden="true">▲</span></button>
  </section>

  <!-- question / reveal card -->
  <section id="card" class="panel" aria-live="polite"></section>

  <!-- full-screen tier reveal -->
  <section id="reveal" hidden aria-live="assertive"></section>
  <div id="topping" hidden><div class="topping-text mono">TOPPING OUT…</div></div>

  <!-- end of round -->
  <section id="end">
    <div id="endTop">
      <div id="cadWrap">
        <canvas id="cad" aria-label="Rotating 3D structural model of your tower. Drag to rotate."></canvas>
        <ul class="cad-legend mono" aria-label="Model colour legend">
          <li><i style="background:#0047ab"></i>Columns</li>
          <li><i style="background:#00a0aa"></i>Beams</li>
          <li><i style="background:#f5b400"></i>Slabs</li>
          <li><i style="background:#d6282e"></i>RC core</li>
          <li><i style="background:#f27814"></i>Belt trusses</li>
          <li><i style="background:#1a9e5a"></i>Supports</li>
        </ul>
        <div class="cad-cap"><b>STRUCTURAL MODEL</b><span id="cadMeta" class="mono"></span><span class="mono drag">DRAG TO ROTATE</span></div>
      </div>
      <div id="archCap" class="cad-cap"><b>ARCHITECTURAL MODEL</b><span class="mono">CONCRETE · STEEL · GLASS</span></div>
    </div>
    <div id="summary"></div>
  </section>

  <noscript><p style="padding:2rem;color:#fff">Skyscraper.io needs JavaScript to build towers.</p></noscript>

  <script src="js/config.js?v=20261127c"></script>
  <script src="data/questions.js?v=20261127e"></script>
  <script src="js/matcher.js?v=20261127e"></script>
  <script src="data/expansions.js?v=20261127c"></script>
  <script>SkyMatcher.applyExpansions(window.SKYSCRAPER_DATA, window.SKYSCRAPER_EXPANSIONS);</script>
  <script src="js/sfx.js?v=20261127f"></script>
  <script src="js/fx.js?v=20261127c"></script>
  <script src="js/flat.js?v=20261127c"></script>
  <script src="js/tower.js?v=20261127c"></script>
  <script src="js/cad.js?v=20261127c"></script>
  <script src="js/game.js?v=20261127c"></script>
</body>
</html>
